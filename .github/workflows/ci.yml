name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node, whose `cache: pnpm` runs it
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Latest Node 22.x satisfies Nuxt 4.6.3's ^22.22.3 engine requirement.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Unit tests and imported-source typecheck
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # Blocking: a high/critical advisory in a production dependency fails
      # the job. Last, so a new advisory doesn't hide the results above. Fix
      # one with `pnpm update --depth Infinity <package>` when the dependent's
      # range allows the patched release; accept one only after checking it
      # can't be reached, under `auditConfig.ignoreGhsas` in
      # pnpm-workspace.yaml with the reason (see CLAUDE.md, Commands).
      - name: Security audit
        run: pnpm audit --prod --audit-level high
