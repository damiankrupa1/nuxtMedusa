name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node, whose `cache: pnpm` runs it
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      # TODO(#16): add `pnpm format:check` here once the pre-existing
      # repo-wide Prettier drift is cleaned up — right now it would fail.

      - name: Build
        run: pnpm build
